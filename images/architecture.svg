<title id="t">ARMOR-NODE-SOLAR-HMI architecture</title>
<desc id="d">The tested core of ARMOR-NODE-SOLAR-HMI reads the solar devices and totals of ARMOR-SERVER, decides what is old or in alarm, guards a PIN and offers no operation on a battery unless every condition holds. A simulator stands in for the server. The screens and the firmware are not written yet.</desc>
